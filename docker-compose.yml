services:
  mongodb:
    image: mongo:latest
    container_name: samma3ni-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - samma3ni-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: samma3ni-backend
    restart: always
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/samma3ni
      - SERVER_PORT=8080
    ports:
      - "8080:8080"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - mongodb
    networks:
      - samma3ni-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: samma3ni-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - samma3ni-net

volumes:
  mongo-data:

networks:
  samma3ni-net:
    driver: bridge
